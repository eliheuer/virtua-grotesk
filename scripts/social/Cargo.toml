[package]
name = "virtua-grotesk-social"
version = "0.1.0"
edition = "2021"
publish = false

# Native social-media compositions for Virtua Grotesk, drawn with designbot.
# This is the "PHASE 4" native square/vertical/carousel system planned by the
# elih.net blog-figure crate (scripts/virtua-grotesk). It reuses the same
# DesignBot renderer, the same OKLCH color-management guardrail, and the same
# section-03 technical-drawing language, applied to social-native canvases.
#
# The designbot rev is pinned to exactly the commit the elih.net figure crate
# uses, so the two systems stay visually identical and this crate builds from
# the already-cached checkout without network access.

[dependencies]
crc32fast = "1.5"
designbot = { git = "https://github.com/eliheuer/designbot", package = "designbot", rev = "f36dd25021b55b9c077f017a156e661490549fbd" }
designbot-render = { git = "https://github.com/eliheuer/designbot", package = "designbot-render", rev = "f36dd25021b55b9c077f017a156e661490549fbd" }
kurbo = "0.12"
norad = "0.18"

[[bin]]
name = "carousel"
path = "src/bin/carousel.rs"

[[bin]]
name = "sq_morph"
path = "src/bin/sq_morph.rs"

[[bin]]
name = "reel_grid"
path = "src/bin/reel_grid.rs"
