# The formats of Virtua Grotesk: the caption and the alternative text of each.
# The layouts come from fgtools. Run `fgtools media --list` to list the formats and canvases.

[words]
caption = "Virtua Grotesk from Thin to Black. Each word fills the measure at one size."
alt = "Large words set in Virtua Grotesk, one for each weight from 100 to 900, each as wide as the column."

[weights]
caption = "The weight axis of Virtua Grotesk, from 100 to 900."
alt = "The same words in seven weights of Virtua Grotesk, from 100 at the top to 900 at the bottom."

[text]
caption = "Virtua Grotesk at text sizes."
alt = "A heading in Virtua Grotesk Bold at 64 pixels, and a paragraph about the typeface in Regular at 32 pixels."

[scripts]
caption = "Virtua Grotesk supports Latin, Arabic and Hebrew."
alt = "One word in each script of Virtua Grotesk: Latin, Arabic and Hebrew, each as wide as the column."

[release]
caption = "Virtua Grotesk is free and open source under the SIL Open Font License."
alt = "The name Virtua Grotesk in the Bold weight, with a table: weights, glyphs, characters, scripts and license."

[link-card]
alt = "The name Virtua Grotesk set in the typeface, with the line: a grid-based neo-grotesk for Latin, Arabic and Hebrew."

[glyph]
caption = "Glyphs of Virtua Grotesk on the 64-unit grid of the design, with the points of the drawing."
alt = "One large glyph on each page, on a square grid, with its points, its handles, and lines for the cap height, the x-height, the baseline and the descender."

[characters]
caption = "The characters of Virtua Grotesk."
alt = "Pages with the capital letters, the small letters, the figures, the punctuation, the Arabic letters and the Hebrew letters of Virtua Grotesk."

[weight-axis]
canvases = ["vertical", "portrait"]
caption = "The weight axis of Virtua Grotesk, from Thin to Black."
alt = "Words in Virtua Grotesk change from weight 100 to weight 900 and back, with a square that moves on a line to show the weight."
