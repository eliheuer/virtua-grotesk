# The brand of Virtua Grotesk in its marketing media: the colors and the texts.
# `make media` renders the formats into output/media/.

[colors]
ground = "#202020"
ink = "#e0e0e0"
accent = "#e8c547"

[text]
tagline = "A grid-based neo-grotesk for Latin, Arabic and Hebrew"
designer = "Eli Heuer"
url = "elih.net"
words = ["Grid", "Virtua", "Systems"]
# Characters that no chosen word has: glyphs that are not finished.
avoid = ["ظ"]
# The glyphs of the glyph pictures.
glyphs = ["a", "G", "R", "g", "&", "?"]
