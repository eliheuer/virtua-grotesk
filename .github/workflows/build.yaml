name: Build and check fonts

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python dependencies
        run: make setup
      - name: Check repository layout
        run: .venv/bin/python -m unittest tests.test_repository_layout -v
      - name: Test proof tools
        run: |
          .venv/bin/python -m unittest discover -s scripts/proof-web/app -p 'test_*.py' -v
          node --test scripts/proof-web/app/test-reference-selection.cjs
      - name: Build fonts
        run: make build
      - name: Run tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Check development Font.Garden profile
        run: ./scripts/check_gf_fonts.sh development
      # The full profile reports release debt, for example the directory name
      # check that applies only to the google/fonts package. It does not fail
      # the build. Its report is in the uploaded artifact.
      - name: Check full Font.Garden profile
        continue-on-error: true
        run: ./scripts/check_gf_fonts.sh full
      - name: Upload fonts and QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: virtuagrotesk-build-and-qa
          if-no-files-found: error
          path: |
            fonts/
            out/qa/
            OFL.txt
            documentation/article/ARTICLE.en_us.html

# A successful build is not human design approval. Releases are prepared and
# published separately after the onboarding checklist and package review.
