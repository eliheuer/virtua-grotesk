name: Build and check fonts

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev
      - name: Install Python dependencies
        run: make setup
      - name: Install Fontspector 1.7.4
        run: |
          curl -fsSL https://github.com/fonttools/fontspector/releases/download/fontspector-v1.7.4/fontspector-v1.7.4-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/fontspector.tar.gz"
          echo "4b1a0af657a4645a56958fadb3b921bce6489bda6d7d1ae8f3ac33baab8e2257  $RUNNER_TEMP/fontspector.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/fontspector"
          tar -xzf "$RUNNER_TEMP/fontspector.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/fontspector"
          echo "$RUNNER_TEMP/fontspector" >> "$GITHUB_PATH"
      - name: Build fonts
        run: make build
      - name: Test QA entrypoints
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Check full Google Fonts profile
        run: ./scripts/check_gf_fonts.sh full
      - name: Upload fonts and QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: virtuagrotesk-build-and-qa
          if-no-files-found: error
          path: |
            fonts/
            out/qa/
            OFL.txt
            documentation/article/ARTICLE.en_us.html

# A successful build is not human design approval. Releases are prepared and
# published separately after the onboarding checklist and package review.
