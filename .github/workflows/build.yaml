name: Build and check fonts

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .venv/bin/designbot
            .venv/.crates.toml
            .venv/.crates2.json
          key: designbot-build-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install the fontconfig headers that DesignBot needs to compile
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config
      - run: make setup
      - run: make test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: virtuagrotesk-fonts-and-qa
          path: |
            fonts/
            output/qa/

  publish:
    # Render the print proof and the marketing media, and publish them on
    # GitHub Pages. No rendered file is tracked in Git.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # make setup installs DesignBot into .venv. The pin of fgtools in
          # requirements.txt sets its commit, so a new pin compiles it again.
          path: |
            .venv/bin/designbot
            .venv/.crates.toml
            .venv/.crates2.json
            ~/.designbot/cache
          key: designbot-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install ffmpeg and the fontconfig headers
        run: |
          # DesignBot needs the fontconfig headers to compile, and it compiles each script.
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev pkg-config ffmpeg
      - run: make setup
      - run: make site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: output/site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
