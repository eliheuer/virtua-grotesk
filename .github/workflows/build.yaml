name: Build and check fonts

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .venv/bin/designbot
            .venv/.crates.toml
            .venv/.crates2.json
          key: designbot-build-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install the fontconfig headers that DesignBot needs to compile
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config
      - run: make setup
      - run: make test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: virtuagrotesk-fonts-and-qa
          path: |
            fonts/
            output/qa/
