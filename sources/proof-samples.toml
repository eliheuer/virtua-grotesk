# Proof samples of Virtua Grotesk.
#
# `make proof-web` and the proof view of Runebender read this file. These
# samples are added to the default samples of fgtools; a sample with
# the key of a default sample replaces it. The format is in the README of
# fgtools (https://github.com/fontgarden/fgtools).
#
# The Hebrew samples are the Hanukkah blessings and the prayer Hanerot
# Halalu, each with vowel points and without them. The text without points
# is the same text with the points removed.

defaults = true

[sample.hanukkah-candles-pointed]
label = "Candles · points"
scripts = ["Hebrew"]
text = "בָּרוּךְ אַתָּה יְיָ אֱלֹהֵינוּ מֶלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָׁנוּ בְּמִצְוֹתָיו, וְצִוָּנוּ לְהַדְלִיק נֵר שֶׁל חֲנֻכָּה."

[sample.hanukkah-candles]
label = "Candles"
scripts = ["Hebrew"]
text = "ברוך אתה יי אלהינו מלך העולם, אשר קדשנו במצותיו, וצונו להדליק נר של חנכה."

[sample.hanukkah-miracles-pointed]
label = "Miracles · points"
scripts = ["Hebrew"]
text = "בָּרוּךְ אַתָּה יְיָ אֱלֹהֵינוּ מֶלֶךְ הָעוֹלָם, שֶׁעָשָׂה נִסִּים לַאֲבוֹתֵינוּ, בַּיָּמִים הָהֵם בַּזְּמַן הַזֶּה."

[sample.hanukkah-miracles]
label = "Miracles"
scripts = ["Hebrew"]
text = "ברוך אתה יי אלהינו מלך העולם, שעשה נסים לאבותינו, בימים ההם בזמן הזה."

[sample.hanukkah-shehecheyanu-pointed]
label = "Shehecheyanu · points"
scripts = ["Hebrew"]
text = "בָּרוּךְ אַתָּה יְיָ אֱלֹהֵינוּ מֶלֶךְ הָעוֹלָם, שֶׁהֶחֱיָנוּ וְקִיְּמָנוּ וְהִגִּיעָנוּ לַזְּמַן הַזֶּה."

[sample.hanukkah-shehecheyanu]
label = "Shehecheyanu"
scripts = ["Hebrew"]
text = "ברוך אתה יי אלהינו מלך העולם, שהחינו וקימנו והגיענו לזמן הזה."

[sample.hanukkah-hanerot-halalu-pointed]
label = "Hanerot Halalu · points"
scripts = ["Hebrew"]
text = "הַנֵּרוֹת הַלָּלוּ אָנוּ מַדְלִיקִין עַל הַנִּסִּים וְעַל הַנִּפְלָאוֹת וְעַל הַתְּשׁוּעוֹת וְעַל הַמִּלְחָמוֹת, שֶׁעָשִׂיתָ לַאֲבוֹתֵינוּ בַּיָּמִים הָהֵם בַּזְּמַן הַזֶּה, עַל יְדֵי כֹּהֲנֶיךָ הַקְּדוֹשִׁים."

[sample.hanukkah-hanerot-halalu]
label = "Hanerot Halalu"
scripts = ["Hebrew"]
text = "הנרות הללו אנו מדליקין על הנסים ועל הנפלאות ועל התשועות ועל המלחמות, שעשית לאבותינו בימים ההם בזמן הזה, על ידי כהניך הקדושים."

# Joined forms with neighboring dot groups and descending strokes.
[sample.arabic-joining-dots]
label = "Arabic joining dots"
scripts = ["Arabic"]
text = "مقاييس تقييم بيانات انتظار انتقال تتم تثبيت"

[sample.persian-joining-dots]
label = "Persian joining dots"
scripts = ["Arabic"]
lang = "fa"
text = "پایین آیین مدیر بیش ویژگی گریز"

[sample.urdu-joining-dots]
label = "Urdu joining dots"
scripts = ["Arabic"]
lang = "ur"
text = "ہیں نہیں یہیں کہیں ہڈی کبڈی"

# The Hebrew height beside the Latin x-height and capitals.
[sample.hebrew-latin-height]
label = "Hebrew and Latin height"
scripts = ["Latin", "Hebrew"]
text = "Virtua שלום Grotesk עולם xHx"

